version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A fresh release gets a week before it is proposed, so a hijacked version is usually pulled first.
    cooldown:
      default-days: 7
    groups:
      development:
        dependency-type: development
    ignore:
      # The types follow the oldest supported Node.js (engines: >=22), not the newest release.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
