# Publishes a tagged version everywhere: npm, GHCR, the MCPB bundle on the
# GitHub release, and the official MCP Registry. Runs only for v* tags.
#
# One-time setup:
#  - environment "release" with a required reviewer: nothing is published until it is approved
#  - npm: configure trusted publishing for this repository and workflow on npmjs.com
#  - registry: secret MCP_REGISTRY_DNS_KEY (Ed25519 private key, hex) whose public key
#    is in the humblecode.eu TXT record ("v=MCPv1; k=ed25519; p=…")
#
# Jobs that hold publishing rights install dependencies without running their scripts, and
# no job keeps the checkout token, so a compromised package can't push or publish on its own.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Tag must match package.json and server.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p 'require("./package.json").version')" = "$version"
          test "$(node -p 'require("./server.json").version')" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Only reviewed code ships: the tagged commit must already be on main.
      - name: Tagged commit must be on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" -q .status)
          case "$status" in
            identical|behind) echo "${GITHUB_SHA} is on main" ;;
            *) echo "${GITHUB_SHA} is not on main (compare status: ${status})" >&2; exit 1 ;;
          esac

  # The checks already ran when the commit reached main; reuse that result instead of running them
  # again. A run still in progress is awaited; a failed one stops the release.
  ci-result:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      status: ${{ steps.ci.outputs.status }}
    steps:
      - id: ci
        name: CI result for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 40); do
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push" \
              -q '[.workflow_runs[] | {status, conclusion}]')
            if jq -e 'any(.[]; .conclusion == "success")' <<<"$runs" >/dev/null; then
              echo "CI passed for ${GITHUB_SHA}"
              echo "status=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if jq -e 'length > 0 and all(.[]; .status == "completed")' <<<"$runs" >/dev/null; then
              echo "CI did not pass for ${GITHUB_SHA}; fix main and tag a new commit" >&2
              exit 1
            fi
            # A run appears a few seconds after the push; after a minute without one, run the checks here.
            if [ "$attempt" -ge 3 ] && jq -e 'length == 0' <<<"$runs" >/dev/null; then
              echo "No CI run for ${GITHUB_SHA}; the release runs the checks itself"
              echo "status=missing" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "waiting for CI on ${GITHUB_SHA} (${attempt}/40)"
            sleep 30
          done
          echo "CI for ${GITHUB_SHA} did not finish within 20 minutes" >&2
          exit 1

  checks:
    needs: ci-result
    if: needs.ci-result.outputs.status == 'missing'
    uses: ./.github/workflows/checks.yml

  # A pushed tag alone ships nothing: the release environment needs a reviewer's approval.
  approve:
    needs: [verify, ci-result, checks]
    # checks is skipped when CI already passed, and a skipped job anywhere upstream would skip this
    # one too (success() looks at every earlier job); run unless something failed or was cancelled.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: echo "Approved release of uol-mcp $VERSION"

  npm:
    needs: [verify, approve]
    # checks is skipped when CI already passed, and a skipped job anywhere upstream would skip this
    # one too (success() looks at every earlier job); run unless something failed or was cancelled.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm >= 11.5; Node 22 ships npm 10.
      - run: npm install -g --ignore-scripts npm@12.2.1
      - run: npm ci --ignore-scripts
      - run: npm run build
      # The very first version is published by hand (npm needs the package before trusted
      # publishing can be enabled); skipping an existing version also makes re-runs safe.
      # --ignore-scripts skips prepublishOnly: verify already ran the tests, build ran above.
      - name: Publish unless this version is already on npm
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if npm view "uol-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "uol-mcp@${VERSION} is already on npm"
          else
            npm publish --provenance --access public --ignore-scripts
          fi

  image:
    needs: [verify, approve]
    # checks is skipped when CI already passed, and a skipped job anywhere upstream would skip this
    # one too (success() looks at every earlier job); run unless something failed or was cancelled.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/jakubbegera/uol-mcp:${{ needs.verify.outputs.version }}
            ghcr.io/jakubbegera/uol-mcp:latest

  # Builds the bundle without any write access; the release job only uploads the result.
  bundle:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - id: pack
        run: |
          bash scripts/build-mcpb.sh
          echo "sha256=$(sha256sum build/uol-mcp.mcpb | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpb
          path: build/uol-mcp.mcpb
          if-no-files-found: error

  github-release:
    needs: [verify, approve, bundle]
    # checks is skipped when CI already passed, and a skipped job anywhere upstream would skip this
    # one too (success() looks at every earlier job); run unless something failed or was cancelled.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpb
          path: build
      # Never replace a published bundle: the MCP Registry pins its SHA-256.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: build/uol-mcp.mcpb
          generate_release_notes: true
          overwrite_files: false

  registry:
    needs: [verify, npm, image, bundle, github-release]
    # checks is skipped when CI already passed, and a skipped job anywhere upstream would skip this
    # one too (success() looks at every earlier job); run unless something failed or was cancelled.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The registry checks the npm package, and a fresh npm version takes a few minutes to appear.
      - name: Wait until npm serves this version
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null "https://registry.npmjs.org/uol-mcp/${VERSION}"; then
              echo "uol-mcp@${VERSION} is on npm"
              exit 0
            fi
            echo "waiting for uol-mcp@${VERSION} on npm (${attempt}/30)"
            sleep 20
          done
          echo "uol-mcp@${VERSION} did not appear on npm within 10 minutes" >&2
          exit 1
      - name: Skip a version the registry already has
        id: existing
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          found=$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=eu.humblecode/uol" | node -e '
            let body = "";
            process.stdin.on("data", (c) => (body += c)).on("end", () => {
              const servers = JSON.parse(body).servers ?? [];
              console.log(servers.some((s) => (s.server ?? s).version === process.env.VERSION) ? "yes" : "no");
            });')
          echo "found=$found" >> "$GITHUB_OUTPUT"
      - name: Add the MCPB package to server.json
        if: steps.existing.outputs.found == 'no'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          SHA256: ${{ needs.bundle.outputs.sha256 }}
        run: |
          node -e '
            const fs = require("fs");
            const server = JSON.parse(fs.readFileSync("server.json", "utf8"));
            server.packages.push({
              registryType: "mcpb",
              identifier: `https://github.com/jakubbegera/uol-mcp/releases/download/v${process.env.VERSION}/uol-mcp.mcpb`,
              fileSha256: process.env.SHA256,
              transport: { type: "stdio" },
            });
            fs.writeFileSync("server.json", JSON.stringify(server, null, 2));
          '
      # The publisher gets the registry key, so the download is checked against the release checksum.
      - name: Install mcp-publisher
        if: steps.existing.outputs.found == 'no'
        env:
          PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
        run: |
          curl -fsSLo mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Publish
        if: steps.existing.outputs.found == 'no'
        env:
          MCP_REGISTRY_DNS_KEY: ${{ secrets.MCP_REGISTRY_DNS_KEY }}
        run: |
          ./mcp-publisher login dns --domain humblecode.eu --private-key "$MCP_REGISTRY_DNS_KEY"
          ./mcp-publisher publish
