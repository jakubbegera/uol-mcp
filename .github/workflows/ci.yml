name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Every supported Node.js line: 22 is the minimum (engines), 26 is what the Docker image runs.
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/index.js --version
      # What ships to users must have no known high or critical advisory; build-time tooling
      # only fails the build on critical ones.
      - name: npm audit (production dependencies)
        if: matrix.node == 22
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (all dependencies)
        if: matrix.node == 22
        run: npm audit --audit-level=critical

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: uol-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Scans the image as published: Alpine packages and the production node_modules.
      - name: Scan the image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: uol-mcp:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
